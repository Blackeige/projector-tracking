<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projector Tracking</title>

<style>
*{box-sizing:border-box}
html,body{
margin:0;width:100%;height:100%;overflow:hidden;
font-family:Arial,sans-serif;background:#07111f;color:white
}
#app{position:relative;width:100%;height:100%;overflow:hidden}

/* STADE */
#stadium{position:absolute;inset:0;overflow:hidden}
.sky{position:absolute;inset:0 0 48%;background:linear-gradient(#06152b,#245a82)}
.lights{
position:absolute;top:8%;left:50%;transform:translateX(-50%);
width:80%;height:12%;
background:radial-gradient(ellipse,#ffffff 0 4%,transparent 5% 100%);
opacity:.8
}
.crowd{
position:absolute;left:0;right:0;top:25%;height:24%;
background:repeating-linear-gradient(90deg,#18283a 0 8px,#30465a 8px 16px,#172437 16px 24px)
}
.pitch{
position:absolute;left:-10%;right:-10%;bottom:-8%;height:58%;
background:linear-gradient(#267b2e,#1b5e24);
transform:perspective(700px) rotateX(12deg);
transform-origin:bottom
}

/* BUT */
#goal{
position:absolute;left:50%;top:30%;
width:min(76vw,760px);height:min(42vh,390px);
transform:translateX(-50%);
border:12px solid #eeeeee;border-bottom-width:18px;
box-shadow:0 0 35px #0008;
background:linear-gradient(90deg,#ffffff12,#ffffff03);
transition:filter .2s
}
#goal::before{
content:"";position:absolute;inset:0;
background:
repeating-linear-gradient(90deg,transparent 0 34px,#fff5 35px 37px),
repeating-linear-gradient(0deg,transparent 0 34px,#fff5 35px 37px);
opacity:.45
}

/* POTEAUX */
#goalPostLeft,
#goalPostRight{
position:absolute;
top:30%;
width:12px;
height:min(42vh,390px);
background:#ff0000;
z-index:3;
box-shadow:0 0 14px #0008;
transition:background .15s;
}

#goalPostLeft{
left:calc(50% - min(38vw,380px));
}

#goalPostRight{
right:calc(50% - min(38vw,380px));
}

/* GARDIEN */
#keeper{
position:absolute;left:50%;top:56%;
width:86px;height:150px;
transform:translate(-50%,-50%);
transition:left .08s linear,transform .15s ease;
z-index:4
}
#keeper .head{
width:42px;height:42px;border-radius:50%;
background:#f0bd8a;margin:auto;position:relative;z-index:2
}
#keeper .head::after{
content:"";position:absolute;left:7px;right:7px;top:8px;
height:10px;background:#3b2419;border-radius:50%
}
#keeper .body{
width:62px;height:82px;background:#e7c51d;
border-radius:18px 18px 8px 8px;margin:-3px auto 0;
box-shadow:inset 0 -10px #c7a817
}
#keeper .arm{
position:absolute;top:50px;width:24px;height:76px;
background:#e7c51d;border-radius:20px;
transform-origin:top center
}
#keeper .arm.l{left:0;transform:rotate(25deg)}
#keeper .arm.r{right:0;transform:rotate(-25deg)}
#keeper .leg{
position:absolute;top:119px;width:24px;height:62px;
background:#182333;border-radius:12px
}
#keeper .leg.l{left:20px}
#keeper .leg.r{right:20px}

#keeper.dive-left{
transform:translate(-50%,-50%) rotate(-18deg) scale(1.08)
}
#keeper.dive-right{
transform:translate(-50%,-50%) rotate(18deg) scale(1.08)
}

/* BALLON */
#ball{
position:absolute;left:50%;top:75%;
width:30px;height:30px;border-radius:50%;
background:white;box-shadow:0 2px 8px #0008;
transform:translate(-50%,-50%);
z-index:5;
transition:left .1s linear,top .1s linear
}
#ball.goalBall{animation:ballGoal .65s ease forwards}
@keyframes ballGoal{
0%{transform:translate(-50%,-50%) scale(1)}
70%{transform:translate(-50%,-50%) scale(1.7)}
100%{transform:translate(-50%,-50%) scale(.8);opacity:0}
}

/* BUT */
#goalEffect{
position:absolute;inset:0;z-index:30;
display:none;align-items:center;justify-content:center;
background:rgba(255,255,255,0);
pointer-events:none
}
#goalEffect.active{
display:flex;animation:goalFlash .9s ease
}
#goalText{
font-size:clamp(60px,15vw,150px);
font-weight:900;text-shadow:0 8px 30px #000;
transform:scale(.5)
}
#goalEffect.active #goalText{
animation:goalText .9s cubic-bezier(.2,1.5,.3,1)
}
@keyframes goalFlash{
0%{background:rgba(255,255,255,.9)}
25%{background:rgba(255,215,0,.25)}
100%{background:rgba(255,255,255,0)}
}
@keyframes goalText{
0%{transform:scale(.3) rotate(-8deg);opacity:0}
35%{transform:scale(1.2) rotate(3deg);opacity:1}
100%{transform:scale(1) rotate(0);opacity:1}
}

/* HUD */
#hud{
position:absolute;top:16px;left:16px;right:16px;
display:flex;justify-content:space-between;z-index:10;
pointer-events:none
}
.badge{
background:#07111fcc;
padding:10px 14px;border-radius:12px
}

/* MENU */
#menu,#settings{
position:absolute;z-index:20;inset:0;
display:flex;align-items:center;justify-content:center;
background:#03101dcc;backdrop-filter:blur(6px)
}
.panel{
width:min(92vw,520px);max-height:92vh;overflow:auto;
background:#0b1726ee;border:1px solid #ffffff22;
border-radius:22px;padding:26px;
box-shadow:0 20px 60px #0008
}
h1{margin:0 0 8px;font-size:clamp(30px,7vw,56px)}
h2{margin-top:0}
.sub{opacity:.75;margin:0 0 22px}
.actions{display:grid;gap:12px}
button{
cursor:pointer;border:0;border-radius:12px;
padding:14px 20px;font-weight:700
}
.primary{background:#2ed573;color:#06140b}
.secondary{background:white;color:#07111f}
.dark{background:#203247;color:white}

/* SETTINGS */
.row{
display:flex;gap:10px;align-items:center;
justify-content:space-between;margin:16px 0;flex-wrap:wrap
}
.row label{font-weight:700}
input[type="color"]{
width:70px;height:42px;padding:2px
}
input[type="range"]{width:180px}
select{
background:#17283b;color:white;
border:1px solid #ffffff22;
border-radius:10px;padding:10px;max-width:100%
}

/* CAMERA */
#cameraPanel{
position:absolute;right:16px;bottom:16px;
width:min(34vw,360px);min-width:210px;
aspect-ratio:4/3;background:black;
border:2px solid #ffffff55;
border-radius:14px;overflow:hidden;z-index:12
}

/*
 * PAR DÉFAUT PAS DE MIROIR.
 * Le mode Mirror peut être activé
 * dans les paramètres.
 */
#camera{
width:100%;height:100%;
object-fit:cover;
transform:none
}

#trackCanvas{display:none}

#trackBox{
position:absolute;
width:55px;height:55px;
border:3px solid #2ed573;
border-radius:8px;
display:none;
transform:translate(-50%,-50%);
z-index:13;
pointer-events:none;
box-shadow:0 0 12px #2ed57399
}

/* REPÈRES DES POTEAUX DANS L'APERÇU */
#previewLeftPost,
#previewRightPost{
position:absolute;
width:5px;
top:0;
bottom:0;
z-index:12;
pointer-events:none;
display:none;
box-shadow:0 0 8px #000
}

#previewLeftPost{
left:10%;
}

#previewRightPost{
right:10%;
}

/* ZONE ENTRE LES POTEAUX */
#previewGoalZone{
position:absolute;
left:10%;
right:10%;
top:8%;
bottom:8%;
border:2px dashed #ffffff88;
z-index:11;
pointer-events:none;
display:none
}

/* STATUT MUR */
#wallStatus{
position:absolute;
left:50%;bottom:8px;
transform:translateX(-50%);
background:#07111fcc;
padding:6px 10px;
border-radius:8px;
font-size:12px;
display:none;
z-index:14;
white-space:nowrap
}

#status{
font-size:13px;
opacity:.8;
margin-top:14px;
min-height:18px
}

.hidden{display:none!important}

@media(max-width:650px){
#goal{top:31%;height:35vh;border-width:8px}
#keeper{transform:translate(-50%,-50%) scale(.75)}
#cameraPanel{width:42vw;min-width:150px}
.panel{padding:20px}
}
</style>
</head>

<script>

/* =========================
   CONFIGURATION
========================= */

const cfg={

width:640,
height:480,

color:"#ff0000",
tolerance:75,

tracking:"ball",
preview:"on",

cameraId:"",
cameraType:"environment",

mirror:"off",

wallDetection:"on",

leftPostColor:"#0000ff",
rightPostColor:"#ff0000",

postTolerance:65

};

let stream=null;
let trackingTimer=null;
let playing=false;
let lastGoalTime=0;
let cameraList=[];


/* DOM */

const $=id=>
document.getElementById(id);


/* =========================
   STATUS
========================= */

function setStatus(text){

$("status").textContent=text;

$("hudStatus").textContent=
text.toUpperCase();

}


/* =========================
   RGB → HSV
========================= */

function rgbToHsv(r,g,b){

r/=255;
g/=255;
b/=255;

const max=Math.max(r,g,b);
const min=Math.min(r,g,b);

const d=max-min;

let h=0;

if(d){

if(max===r){

h=((g-b)/d)%6;

}else if(max===g){

h=(b-r)/d+2;

}else{

h=(r-g)/d+4;

}

h*=60;

if(h<0){
h+=360;
}

}

return[
h,
max?d/max:0,
max
];

}


/* =========================
   HEX → RGB
========================= */

function hexRgb(hex){

return[

parseInt(
hex.slice(1,3),
16
),

parseInt(
hex.slice(3,5),
16
),

parseInt(
hex.slice(5,7),
16
)

];

}


/* =========================
   HSV CIBLE
========================= */

function targetHsv(){

const[r,g,b]=
hexRgb(cfg.color);

return rgbToHsv(r,g,b);

}


/* =========================
   CAMERA COLOR HSV
========================= */

function colorHsv(hex){

const[r,g,b]=
hexRgb(hex);

return rgbToHsv(
r,g,b
);

}


/* =========================
   DISTANCE COULEUR
========================= */

function colorMatch(
r,
g,
b,
target,
tolerance
){

const[h,s,v]=
rgbToHsv(r,g,b);

let dh=
Math.abs(h-target[0]);

dh=
Math.min(
dh,
360-dh
);

/*
 * Tracking couleur privilégié :
 *
 * la teinte est prioritaire,
 * puis saturation/luminosité.
 */

return(

dh<=tolerance &&

Math.abs(
s-target[1]
)<=.65 &&

v>.12

);

}


/* =========================
   CAMERAS
========================= */

async function loadCameras(){

if(
!navigator.mediaDevices ||
!navigator.mediaDevices.enumerateDevices
){
return;
}

try{

const devices=
await navigator.mediaDevices
.enumerateDevices();

cameraList=
devices.filter(
device=>
device.kind==="videoinput"
);

const select=
$("cameraSelect");

select.innerHTML=
'<option value="auto">🔄 Automatique</option>';

cameraList.forEach(
(device,index)=>{

const option=
document.createElement(
"option"
);

option.value=
device.deviceId;

option.textContent=
"📷 "+
(
device.label ||
"Caméra "+(index+1)
);

select.appendChild(
option
);

});

if(cfg.cameraId){

select.value=
cfg.cameraId;

}

}catch(error){

console.error(error);

}

}


/* =========================
   OUVRIR CAMERA
========================= */

async function openCamera(){

stopCamera();

const videoConstraints={

width:{
ideal:cfg.width
},

height:{
ideal:cfg.height
}

};

if(cfg.cameraId){

videoConstraints.deviceId={
exact:cfg.cameraId
};

}else if(
cfg.cameraType!=="any"
){

videoConstraints.facingMode={
ideal:cfg.cameraType
};

}

try{

const cameraStream=
await navigator
.mediaDevices
.getUserMedia({

audio:false,

video:
videoConstraints

});

stream=
cameraStream;

$("camera").srcObject=
cameraStream;


/*
 * Aperçu non-miroir
 * par défaut.
 */

$("camera").style.transform=
cfg.mirror==="on"
?
"scaleX(-1)"
:
"none";


$("cameraPanel")
.classList.toggle(
"hidden",
cfg.preview==="off"
);

playing=true;

const track=
stream.getVideoTracks()[0];

const settings=
track.getSettings();

if(settings.deviceId){

cfg.cameraId=
settings.deviceId;

}

await loadCameras();

if(cfg.cameraId){

$("cameraSelect").value=
cfg.cameraId;

}

setStatus(
"CAMÉRA : ON"
);

updatePreviewPosts();

startTracking();

}catch(error){

console.error(error);

playing=false;

setStatus(
"CAMÉRA REFUSÉE / INDISPONIBLE"
);

}

}


/* =========================
   PERMISSION CAMERA
========================= */

async function requestCameraPermission(){

if(
!navigator.mediaDevices ||
!navigator.mediaDevices.getUserMedia
){

setStatus(
"HTTPS OU NAVIGATEUR NON COMPATIBLE"
);

return;

}

try{

const tempStream=
await navigator.mediaDevices
.getUserMedia({

video:true,
audio:false

});

tempStream
.getTracks()
.forEach(
track=>
track.stop()
);

await loadCameras();

openCamera();

}catch(error){

console.error(error);

setStatus(
"AUTORISATION CAMÉRA REFUSÉE"
);

}

}


/* =========================
   STOP CAMERA
========================= */

function stopCamera(){

if(stream){

stream
.getTracks()
.forEach(
track=>
track.stop()
);

stream=null;

}

$("camera").srcObject=null;

if(trackingTimer){

cancelAnimationFrame(
trackingTimer
);

trackingTimer=null;

}

}


/* =========================
   APERCU POTEAUX
========================= */

function updatePreviewPosts(){

$("previewLeftPost").style.background=
cfg.leftPostColor;

$("previewRightPost").style.background=
cfg.rightPostColor;

$("goalPostLeft").style.background=
cfg.leftPostColor;

$("goalPostRight").style.background=
cfg.rightPostColor;

if(cfg.wallDetection==="on"){

$("previewLeftPost").style.display=
"block";

$("previewRightPost").style.display=
"block";

$("previewGoalZone").style.display=
"block";

}else{

$("previewLeftPost").style.display=
"none";

$("previewRightPost").style.display=
"none";

$("previewGoalZone").style.display=
"none";

}

}


/* =========================
   DETECTION POTEAU
========================= */

function detectPost(
data,
width,
height,
target,
side
){

const step=3;

let sx=0;
let sy=0;
let count=0;

let minX=
side==="left"
?
0
:
Math.floor(width*.50);

let maxX=
side==="left"
?
Math.floor(width*.50)
:
width;


/*
 * Recherche très focalisée
 * sur chaque moitié.
 */

for(
let y=0;
y<height;
y+=step
){

for(
let x=minX;
x<maxX;
x+=step
){

const i=
(y*width+x)*4;

const r=data[i];
const g=data[i+1];
const b=data[i+2];

if(
colorMatch(
r,
g,
b,
target,
cfg.postTolerance
)
){

sx+=x;
sy+=y;
count++;

}

}

}

if(count<10){

return null;

}

return{

x:sx/count,
y:sy/count,
count:count

};

}


/* =========================
   DETECTION DES DEUX POTEAUX
========================= */

function detectGoalPosts(
data,
width,
height
){

if(
cfg.wallDetection==="off"
){

$("wallStatus").style.display=
"none";

return{

left:null,
right:null

};

}

const leftTarget=
colorHsv(
cfg.leftPostColor
);

const rightTarget=
colorHsv(
cfg.rightPostColor
);

const left=
detectPost(
data,
width,
height,
leftTarget,
"left"
);

const right=
detectPost(
data,
width,
height,
rightTarget,
"right"
);

if(left && right){

$("wallStatus").style.display=
"block";

$("wallStatus").textContent=
"🧱 POTEAUX DÉTECTÉS";

}else if(left || right){

$("wallStatus").style.display=
"block";

$("wallStatus").textContent=
"🧱 1 POTEAU DÉTECTÉ";

}else{

$("wallStatus").style.display=
"none";

}

return{

left:left,
right:right

};

}


/* =========================
   DETECTION COLLISION MUR
========================= */

function isTouchingWall(
x,
y,
posts
){

if(
!posts.left ||
!posts.right
){

return false;

}

const leftX=
posts.left.x;

const rightX=
posts.right.x;


/*
 * Si les deux feuilles sont
 * dans le bon ordre, on crée
 * automatiquement la zone du but.
 */

const goalLeft=
Math.min(
leftX,
rightX
);

const goalRight=
Math.max(
leftX,
rightX
);


/*
 * Tolérance autour des poteaux.
 */

const marginX=
Math.max(
12,
(cfg.width*.04)
);


/*
 * Zone verticale :
 * on accepte une grande partie
 * de l'espace entre les poteaux.
 */

const insideX=
x>=goalLeft-marginX &&
x<=goalRight+marginX;

const avgPostY=
(
posts.left.y+
posts.right.y
)/2;

const verticalDistance=
Math.abs(
y-avgPostY
);

const verticalOK=
verticalDistance<
cfg.height*.42;

return(
insideX &&
verticalOK
);

}


/* =========================
   BUT
========================= */

function triggerGoal(){

const now=
performance.now();

if(
now-lastGoalTime<1400
){

return;

}

lastGoalTime=
now;

$("goal")
.classList.remove(
"goalHit"
);

$("ball")
.classList.remove(
"goalBall"
);

$("goalEffect")
.classList.remove(
"active"
);

void $("goal").offsetWidth;
void $("goalEffect").offsetWidth;

$("goal")
.classList.add(
"goalHit"
);

$("ball")
.classList.add(
"goalBall"
);

$("goalEffect")
.classList.add(
"active"
);

setStatus(
"⚽ BUT !"
);

setTimeout(
()=>{

$("goalEffect")
.classList.remove(
"active"
);

$("ball")
.classList.remove(
"goalBall"
);

if(playing){

setStatus(
"CAMÉRA : ON"
);

}

},
1000
);

}


/* =========================
   GARDIEN
========================= */

function updateKeeper(
x,
y
){

const percentX=
(1-x/cfg.width)*100;

const keeperPosition=
Math.max(
8,
Math.min(
92,
percentX
)
);

$("keeper").style.left=
keeperPosition+"%";


const ballX=
8+(x/cfg.width)*84;

const ballY=
48+(y/cfg.height)*40;

$("ball").style.left=
ballX+"%";

$("ball").style.top=
ballY+"%";

$("keeper")
.classList.remove(
"dive-left",
"dive-right"
);

const center=
cfg.width/2;

if(
x<center-90
){

$("keeper")
.classList.add(
"dive-left"
);

}else if(
x>center+90
){

$("keeper")
.classList.add(
"dive-right"
);

}

}


/* =========================
   TRACKING PRINCIPAL
========================= */

function startTracking(){

if(trackingTimer){

cancelAnimationFrame(
trackingTimer
);

}

const canvas=
$("trackCanvas");

const ctx=
canvas.getContext(
"2d",
{
willReadFrequently:true
}
);

canvas.width=
cfg.width;

canvas.height=
cfg.height;


/*
 * Les couleurs sont analysées
 * sur la vidéo originale.
 *
 * Le Mirror ne modifie donc PAS
 * la logique du tracking.
 */

function loop(){

if(
!playing ||
!stream
){

return;

}

const video=
$("camera");

if(
video.readyState>=2
){

ctx.drawImage(
video,
0,
0,
cfg.width,
cfg.height
);

const image=
ctx.getImageData(
0,
0,
cfg.width,
cfg.height
);

const data=
image.data;


/*
 * POTEAUX EN PREMIER.
 */

const posts=
detectGoalPosts(
data,
cfg.width,
cfg.height
);


/*
 * TRACKING OBJET.
 */

let sx=0;
let sy=0;
let count=0;

const[
targetH,
targetS,
targetV
]=
targetHsv();

const target=[
targetH,
targetS,
targetV
];


/*
 * Tracking haute priorité.
 *
 * Plus précis que la détection
 * du mur : chaque pixel de
 * couleur cible est analysé.
 */

const step=3;

for(
let y=0;
y<cfg.height;
y+=step
){

for(
let x=0;
x<cfg.width;
x+=step
){

const i=
(y*cfg.width+x)*4;

const r=
data[i];

const g=
data[i+1];

const b=
data[i+2];

let matched=false;

if(
cfg.tracking==="bright"
){

matched=
r+g+b>690;

}else{

matched=
colorMatch(
r,
g,
b,
target,
cfg.tolerance
);

}

if(matched){

/*
 * Les pixels des poteaux
 * sont ignorés pour éviter
 * qu'ils prennent le contrôle
 * du tracking.
 */

const nearLeftPost=
posts.left &&
Math.abs(x-posts.left.x)<35;

const nearRightPost=
posts.right &&
Math.abs(x-posts.right.x)<35;

if(
nearLeftPost ||
nearRightPost
){

continue;

}

sx+=x;
sy+=y;
count++;

}

}

}


/*
 * Position tracking trouvée.
 */

if(count>8){

const x=
sx/count;

const y=
sy/count;


/*
 * Gardien + ballon.
 */

updateKeeper(
x,
y
);


/*
 * Carré dans l'aperçu.
 *
 * On utilise les coordonnées
 * originales de la caméra.
 */

$("trackBox").style.display=
"block";

$("trackBox").style.left=
(x/cfg.width*100)+"%";

$("trackBox").style.top=
(y/cfg.height*100)+"%";


/*
 * COLLISION AVEC LE MUR.
 *
 * Le but est calculé uniquement
 * avec les deux poteaux détectés.
 */

if(
cfg.wallDetection==="on" &&
isTouchingWall(
x,
y,
posts
)
){

triggerGoal();

}

}else{

$("trackBox").style.display=
"none";

}

}

trackingTimer=
requestAnimationFrame(
loop
);

}

loop();

}

"click",
()=>{

const[
width,
height
]=
$("resolution")
.value
.split("x")
.map(Number);

cfg.width=
width;

cfg.height=
height;

cfg.color=
$("color").value;

cfg.tolerance=
Number(
$("tolerance").value
);

cfg.tracking=
$("tracking").value;

cfg.preview=
$("preview").value;

cfg.wallDetection=
$("wallDetection").value;

cfg.leftPostColor=
$("leftPostColor").value;

cfg.rightPostColor=
$("rightPostColor").value;

cfg.postTolerance=
Number(
$("postTolerance").value
);

cfg.mirror=
$("mirror").value;

cfg.cameraType=
$("cameraType").value;

cfg.cameraId=
$("cameraSelect").value==="auto"
?
""
:
$("cameraSelect").value;


/*
 * Couleurs des poteaux
 * dans le jeu + aperçu.
 */

updatePreviewPosts();


/*
 * Mirror uniquement pour
 * l'affichage vidéo.
 *
 * Le tracking reste identique.
 */

$("camera").style.transform=
cfg.mirror==="on"
?
"scaleX(-1)"
:
"none";


$("settings")
.classList.add(
"hidden"
);

$("menu")
.classList.remove(
"hidden"
);


if(stream){

openCamera();

}

}
);
