<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projector Tracking</title>

<style>
*{box-sizing:border-box}

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
font-family:Arial,sans-serif;
background:#07111f;
color:white
}

#app{
position:relative;
width:100%;
height:100%;
overflow:hidden
}

/* =========================
   STADE
========================= */

#stadium{
position:absolute;
inset:0;
overflow:hidden
}

.sky{
position:absolute;
inset:0 0 48%;
background:linear-gradient(#06152b,#245a82)
}

.lights{
position:absolute;
top:8%;
left:50%;
transform:translateX(-50%);
width:80%;
height:12%;
background:radial-gradient(
ellipse,
#ffffff 0 4%,
transparent 5% 100%
);
opacity:.8
}

.crowd{
position:absolute;
left:0;
right:0;
top:25%;
height:24%;
background:
repeating-linear-gradient(
90deg,
#18283a 0 8px,
#30465a 8px 16px,
#172437 16px 24px
)
}

.pitch{
position:absolute;
left:-10%;
right:-10%;
bottom:-8%;
height:58%;
background:linear-gradient(
#267b2e,
#1b5e24
);
transform:
perspective(700px)
rotateX(12deg);
transform-origin:bottom
}

/* =========================
   BUT
========================= */

#goal{
position:absolute;
left:50%;
top:30%;
width:min(76vw,760px);
height:min(42vh,390px);
transform:translateX(-50%);
border:12px solid #eeeeee;
border-bottom-width:18px;
box-shadow:0 0 35px #0008;
background:
linear-gradient(
90deg,
#ffffff12,
#ffffff03
);
transition:filter .2s
}

#goal::before{
content:"";
position:absolute;
inset:0;
background:
repeating-linear-gradient(
90deg,
transparent 0 34px,
#fff5 35px 37px
),
repeating-linear-gradient(
0deg,
transparent 0 34px,
#fff5 35px 37px
);
opacity:.45
}

/* =========================
   GARDIEN
========================= */

#keeper{
position:absolute;
left:50%;
top:56%;
width:86px;
height:150px;
transform:translate(-50%,-50%);
transition:
left .08s linear,
transform .15s ease;
z-index:4
}

#keeper .head{
width:42px;
height:42px;
border-radius:50%;
background:#f0bd8a;
margin:auto;
position:relative;
z-index:2
}

#keeper .head::after{
content:"";
position:absolute;
left:7px;
right:7px;
top:8px;
height:10px;
background:#3b2419;
border-radius:50%
}

#keeper .body{
width:62px;
height:82px;
background:#e7c51d;
border-radius:
18px 18px
8px 8px;
margin:-3px auto 0;
box-shadow:
inset 0 -10px #c7a817
}

#keeper .arm{
position:absolute;
top:50px;
width:24px;
height:76px;
background:#e7c51d;
border-radius:20px;
transform-origin:top center
}

#keeper .arm.l{
left:0;
transform:rotate(25deg)
}

#keeper .arm.r{
right:0;
transform:rotate(-25deg)
}

#keeper .leg{
position:absolute;
top:119px;
width:24px;
height:62px;
background:#182333;
border-radius:12px
}

#keeper .leg.l{
left:20px
}

#keeper .leg.r{
right:20px
}

#keeper.dive-left{
transform:
translate(-50%,-50%)
rotate(-18deg)
scale(1.08)
}

#keeper.dive-right{
transform:
translate(-50%,-50%)
rotate(18deg)
scale(1.08)
}

/* =========================
   BALLON
========================= */

#ball{
position:absolute;
left:50%;
top:75%;
width:30px;
height:30px;
border-radius:50%;
background:white;
box-shadow:0 2px 8px #0008;
transform:translate(-50%,-50%);
z-index:5;
transition:
left .1s linear,
top .1s linear
}

#ball.goalBall{
animation:
ballGoal .65s ease forwards
}

@keyframes ballGoal{

0%{
transform:
translate(-50%,-50%)
scale(1)
}

70%{
transform:
translate(-50%,-50%)
scale(1.7)
}

100%{
transform:
translate(-50%,-50%)
scale(.8);
opacity:0
}

}

/* =========================
   EFFET BUT
========================= */

#goalEffect{
position:absolute;
inset:0;
z-index:30;
display:none;
align-items:center;
justify-content:center;
background:rgba(255,255,255,0);
pointer-events:none
}

#goalEffect.active{
display:flex;
animation:
goalFlash .9s ease
}

#goalText{
font-size:
clamp(
60px,
15vw,
150px
);
font-weight:900;
text-shadow:
0 8px 30px #000;
transform:scale(.5)
}

#goalEffect.active #goalText{
animation:
goalText .9s cubic-bezier(
.2,
1.5,
.3,
1
)
}

@keyframes goalFlash{

0%{
background:rgba(255,255,255,.9)
}

25%{
background:rgba(255,215,0,.25)
}

100%{
background:rgba(255,255,255,0)
}

}

@keyframes goalText{

0%{
transform:
scale(.3)
rotate(-8deg);
opacity:0
}

35%{
transform:
scale(1.2)
rotate(3deg);
opacity:1
}

100%{
transform:
scale(1)
rotate(0);
opacity:1
}

}

/* =========================
   HUD
========================= */

#hud{
position:absolute;
top:16px;
left:16px;
right:16px;
display:flex;
justify-content:space-between;
z-index:10;
pointer-events:none
}

.badge{
background:#07111fcc;
padding:10px 14px;
border-radius:12px
}

/* =========================
   MENU
========================= */

#menu,
#settings{
position:absolute;
z-index:20;
inset:0;
display:flex;
align-items:center;
justify-content:center;
background:#03101dcc;
backdrop-filter:blur(6px)
}

.panel{
width:min(92vw,520px);
max-height:92vh;
overflow:auto;
background:#0b1726ee;
border:1px solid #ffffff22;
border-radius:22px;
padding:26px;
box-shadow:
0 20px 60px #0008
}

h1{
margin:0 0 8px;
font-size:
clamp(
30px,
7vw,
56px
)
}

h2{
margin-top:0
}

.sub{
opacity:.75;
margin:0 0 22px
}

.actions{
display:grid;
gap:12px
}

button{
cursor:pointer;
border:0;
border-radius:12px;
padding:14px 20px;
font-weight:700
}

.primary{
background:#2ed573;
color:#06140b
}

.secondary{
background:white;
color:#07111f
}

.dark{
background:#203247;
color:white
}

/* =========================
   SETTINGS
========================= */

.row{
display:flex;
gap:10px;
align-items:center;
justify-content:space-between;
margin:16px 0;
flex-wrap:wrap
}

.row label{
font-weight:700
}

input[type="color"]{
width:70px;
height:42px;
padding:2px
}

input[type="range"]{
width:180px
}

select{
background:#17283b;
color:white;
border:1px solid #ffffff22;
border-radius:10px;
padding:10px;
max-width:100%
}

/* =========================
   CAMERA
========================= */

#cameraPanel{
position:absolute;
right:16px;
bottom:16px;
width:min(34vw,360px);
min-width:210px;
aspect-ratio:4/3;
background:#000;
border:2px solid #ffffff55;
border-radius:14px;
overflow:hidden;
z-index:12
}

#camera{
width:100%;
height:100%;
object-fit:cover;
transform:none
}

#trackCanvas{
display:none
}

/* =========================
   OVERLAY TRACKING CAMERA
========================= */

#cameraOverlay{
position:absolute;
inset:0;
pointer-events:none;
z-index:20
}

/*
 * Carré du ballon.
 *
 * Il est calculé sur la vraie
 * zone détectée, donc il suit
 * réellement le ballon.
 */

#trackBox{
position:absolute;
width:40px;
height:40px;
border:3px solid #2ed573;
border-radius:8px;
display:none;
transform:translate(-50%,-50%);
z-index:25;
pointer-events:none;
box-shadow:
0 0 10px #000,
0 0 15px currentColor
}

/*
 * Carrés des deux feuilles/poteaux.
 * Ils apparaissent UNIQUEMENT
 * lorsqu'une vraie couleur est
 * détectée dans la caméra.
 */

.postBox{
position:absolute;
display:none;
transform:translate(-50%,-50%);
border:3px solid;
border-radius:6px;
z-index:24;
pointer-events:none;
box-shadow:
0 0 10px #000,
0 0 15px currentColor
}

#leftPostBox{
color:#00aaff;
border-color:#00aaff
}

#rightPostBox{
color:#ff3333;
border-color:#ff3333
}

/*
 * Ligne de zone réelle entre
 * les deux poteaux détectés.
 *
 * Ce n'est PAS une ligne fixe :
 * elle est calculée uniquement
 * lorsque les deux feuilles
 * sont réellement détectées.
 */

#goalTrackingLine{
position:absolute;
height:3px;
display:none;
transform:translateY(-50%);
z-index:23;
pointer-events:none;
background:linear-gradient(
90deg,
#ffffff00,
#ffffffcc,
#ffffff00
);
box-shadow:
0 0 8px #fff
}

/*
 * Indicateur de proximité.
 */

#proximityIndicator{
position:absolute;
display:none;
transform:translate(-50%,-100%);
background:#07111fcc;
padding:5px 8px;
border-radius:7px;
font-size:11px;
white-space:nowrap;
z-index:27;
pointer-events:none
}

/*
 * Etat des poteaux.
 */

#wallStatus{
position:absolute;
left:50%;
bottom:8px;
transform:translateX(-50%);
background:#07111fcc;
padding:6px 10px;
border-radius:8px;
font-size:12px;
display:none;
z-index:28;
white-space:nowrap
}

#status{
font-size:13px;
opacity:.8;
margin-top:14px;
min-height:18px
}

.hidden{
display:none!important
}

@media(max-width:650px){

#goal{
top:31%;
height:35vh;
border-width:8px
}

#keeper{
transform:
translate(-50%,-50%)
scale(.75)
}

#cameraPanel{
width:42vw;
min-width:150px
}

.panel{
padding:20px
}

}
</style>
</head>

<body>

<div id="app">

<!-- STADE -->

<div class="crowd"></div>

<div id="goal"></div>

<div class="head"></div>

class="badge"

>

id="cameraPanel"

>

</div>

</p>

id="startBtn"

<script>

/* =========================
   CONFIG
========================= */

const cfg={

width:640,
height:480,

color:"#ffff00",

/*
 * Tolérance plus basse :
 * on privilégie le tracking.
 */
tolerance:45,

tracking:"ball",

preview:"on",

cameraId:"",
cameraType:"environment",

mirror:"off",

wallDetection:"on",

leftPostColor:"#0000ff",
rightPostColor:"#ff0000",

postTolerance:35

};


let stream=null;
let trackingTimer=null;
let playing=false;

let lastGoalTime=0;

let cameraList=[];


/* =========================
   DOM
========================= */

const $=id=>
document.getElementById(id);


/* =========================
   STATUS
========================= */

function setStatus(text){

$("status").textContent=text;

$("hudStatus").textContent=
text.toUpperCase();

}


/* =========================
   RGB → HSV
========================= */

function rgbToHsv(r,g,b){

r/=255;
g/=255;
b/=255;

const max=
Math.max(r,g,b);

const min=
Math.min(r,g,b);

const d=max-min;

let h=0;

if(d!==0){

if(max===r){

h=((g-b)/d)%6;

}else if(max===g){

h=(b-r)/d+2;

}else{

h=(r-g)/d+4;

}

h*=60;

if(h<0){
h+=360;
}

}

return[
h,
max===0?0:d/max,
max
];

}


/* =========================
   HEX RGB
========================= */

function hexRgb(hex){

return[

parseInt(
hex.slice(1,3),
16
),

parseInt(
hex.slice(3,5),
16
),

parseInt(
hex.slice(5,7),
16
)

];

}


/* =========================
   COULEUR → HSV
========================= */

function colorHsv(hex){

const[
r,
g,
b
]=hexRgb(hex);

return rgbToHsv(
r,
g,
b
);

}


/* =========================
   DISTANCE TEINTE
========================= */

function hueDistance(
a,
b
){

let d=
Math.abs(a-b);

return Math.min(
d,
360-d
);

}


/* =========================
   TEST COULEUR
========================= */

function colorMatch(
r,
g,
b,
target,
tolerance
){

const[
h,
s,
v
]=rgbToHsv(
r,
g,
b
);


/*
 * La teinte est prioritaire.
 */

if(
hueDistance(
h,
target[0]
)>
tolerance
){

return false;

}


/*
 * Évite les pixels gris/blanc
 * qui ressemblent à toutes
 * les couleurs.
 */

if(
s<
Math.max(
.18,
target[1]-.45
)
){

return false;

}

if(v<.12){

return false;

}

return true;

}


/* =========================
   CAMÉRAS
========================= */

async function loadCameras(){

if(
!navigator.mediaDevices ||
!navigator.mediaDevices.enumerateDevices
){

return;

}

try{

const devices=
await navigator
.mediaDevices
.enumerateDevices();

cameraList=
devices.filter(
device=>
device.kind==="videoinput"
);

const select=
$("cameraSelect");

select.innerHTML=
'<option value="auto">🔄 Automatique</option>';

cameraList.forEach(
(device,index)=>{

const option=
document.createElement(
"option"
);

option.value=
device.deviceId;

option.textContent=
"📷 "+
(
device.label ||
"Caméra "+(index+1)
);

select.appendChild(
option
);

});

if(cfg.cameraId){

select.value=
cfg.cameraId;

}

}catch(error){

console.error(error);

}

}


/* =========================
   CAMERA
========================= */

async function openCamera(){

stopCamera();

const videoConstraints={

width:{
ideal:cfg.width
},

height:{
ideal:cfg.height
}

};


if(cfg.cameraId){

videoConstraints.deviceId={
exact:cfg.cameraId
};

}else if(
cfg.cameraType!=="any"
){

videoConstraints.facingMode={
ideal:cfg.cameraType
};

}


try{

const cameraStream=
await navigator
.mediaDevices
.getUserMedia({

audio:false,

video:
videoConstraints

});

stream=
cameraStream;

$("camera").srcObject=
cameraStream;


/*
 * Mirror uniquement
 * sur l'affichage.
 */

$("camera").style.transform=
cfg.mirror==="on"
?
"scaleX(-1)"
:
"none";


$("cameraPanel")
.classList.toggle(
"hidden",
cfg.preview==="off"
);

playing=true;

const track=
stream
.getVideoTracks()[0];

const settings=
track.getSettings();

if(settings.deviceId){

cfg.cameraId=
settings.deviceId;

}

await loadCameras();

if(cfg.cameraId){

$("cameraSelect").value=
cfg.cameraId;

}

setStatus(
"CAMÉRA : ON"
);

startTracking();

}catch(error){

console.error(error);

playing=false;

setStatus(
"CAMÉRA REFUSÉE / INDISPONIBLE"
);

}

}


/* =========================
   PERMISSION
========================= */

async function requestCameraPermission(){

if(
!navigator.mediaDevices ||
!navigator.mediaDevices.getUserMedia
){

setStatus(
"HTTPS OU NAVIGATEUR NON COMPATIBLE"
);

return;

}

try{

const tempStream=
await navigator
.mediaDevices
.getUserMedia({

video:true,
audio:false

});

tempStream
.getTracks()
.forEach(
track=>
track.stop()
);

await loadCameras();

openCamera();

}catch(error){

console.error(error);

setStatus(
"AUTORISATION CAMÉRA REFUSÉE"
);

}

}


/* =========================
   STOP
========================= */

function stopCamera(){

if(stream){

stream
.getTracks()
.forEach(
track=>
track.stop()
);

stream=null;

}

$("camera").srcObject=null;

if(trackingTimer){

cancelAnimationFrame(
trackingTimer
);

trackingTimer=null;

}

}


/* =========================
   CENTRE + BOUNDING BOX
========================= */

function createDetection(){

return{

count:0,

sumX:0,
sumY:0,

minX:Infinity,
minY:Infinity,

maxX:-Infinity,
maxY:-Infinity

};

}


function addPixel(
d,
x,
y
){

d.count++;

d.sumX+=x;
d.sumY+=y;

if(x<d.minX)d.minX=x;
if(x>d.maxX)d.maxX=x;

if(y<d.minY)d.minY=y;
if(y>d.maxY)d.maxY=y;

}


function finishDetection(d){

if(d.count<=0){

return null;

}

return{

x:d.sumX/d.count,
y:d.sumY/d.count,

width:
d.maxX-d.minX,

height:
d.maxY-d.minY,

area:
(d.maxX-d.minX)*
(d.maxY-d.minY),

count:d.count,

minX:d.minX,
minY:d.minY,
maxX:d.maxX,
maxY:d.maxY

};

}


/* =========================
   DETECTION BALLON
========================= */

function detectBall(
data,
width,
height
){

const target=
colorHsv(cfg.color);

const d=
createDetection();


/*
 * Pas de tracking sur les bords
 * extrêmes pour limiter le bruit.
 */

const step=3;

for(
let y=0;
y<height;
y+=step
){

for(
let x=0;
x<width;
x+=step
){

const i=
(y*width+x)*4;

const r=data[i];
const g=data[i+1];
const b=data[i+2];

let match=false;

if(
cfg.tracking==="bright"
){

match=
r+g+b>690;

}else{

match=
colorMatch(
r,
g,
b,
target,
cfg.tolerance
);

}

if(match){

addPixel(
d,
x,
y
);

}

}

}


/*
 * Il faut suffisamment de pixels.
 */

if(
d.count<10
){

return null;

}

const result=
finishDetection(d);


/*
 * Rejette les énormes zones
 * de couleur.
 *
 * Ça évite qu'un mur entier
 * jaune devienne le ballon.
 */

const imageArea=
width*height;

if(
result.area>
imageArea*.35
){

return null;

}


/*
 * Rejette les minuscules
 * parasites.
 */

if(
result.width<4 ||
result.height<4
){

return null;

}

return result;

}


/* =========================
   DETECTION POTEAU
========================= */

function detectPost(
data,
width,
height,
target,
side
){

const d=
createDetection();

const step=3;


/*
 * Chaque couleur possède
 * sa propre moitié.
 */

let startX=0;
let endX=width;

if(side==="left"){

startX=0;
endX=
Math.floor(width*.50);

}else{

startX=
Math.floor(width*.50);
endX=width;

}


for(
let y=0;
y<height;
y+=step
){

for(
let x=startX;
x<endX;
x+=step
){

const i=
(y*width+x)*4;

const r=data[i];
const g=data[i+1];
const b=data[i+2];

if(
colorMatch(
r,
g,
b,
target,
cfg.postTolerance
)
){

addPixel(
d,
x,
y
);

}

}

}


if(
d.count<12
){

return null;

}

const result=
finishDetection(d);


/*
 * Un poteau doit avoir une
 * forme suffisamment verticale.
 */

const aspect=
result.height/
Math.max(
1,
result.width
);


/*
 * Une feuille peut être assez
 * large, donc on garde une
 * tolérance large.
 */

if(
aspect<.35
){

return null;

}

return result;

}

/* =========================
   LIGNE ENTRE POTEAUX
========================= */

function updateGoalTrackingLine(
left,
right
){

if(!left || !right){

$("goalTrackingLine")
.style.display="none";

return;

}


const x1=
left.x/cfg.width*100;

const x2=
right.x/cfg.width*100;

const y=
(
(
left.y+
right.y
)/2
)/cfg.height*100;

const width=
Math.abs(x2-x1);

const center=
(x1+x2)/2;

$("goalTrackingLine")
.style.display="block";

$("goalTrackingLine")
.style.left=
(center-width/2)+"%";

$("goalTrackingLine")
.style.width=
width+"%";

$("goalTrackingLine")
.style.top=
y+"%";

}


/* =========================
   PROXIMITÉ DU MUR
========================= */

function calculateWallProximity(
ball,
left,
right
){

if(
!ball ||
!left ||
!right
){

return{

near:false,
distance:Infinity,
side:null

};

}


/*
 * Les poteaux détectés donnent
 * la vraie largeur de la cage
 * dans l'image.
 */

const leftX=
Math.min(
left.x,
right.x
);

const rightX=
Math.max(
left.x,
right.x
);


/*
 * Distance du ballon au poteau
 * le plus proche.
 */

const distanceLeft=
Math.abs(
ball.x-leftX
);

const distanceRight=
Math.abs(
ball.x-rightX
);

const distance=
Math.min(
distanceLeft,
distanceRight
);

const side=
distanceLeft<
distanceRight
?
"gauche"
:
"droite";


/*
 * Largeur actuelle entre les
 * deux poteaux.
 */

const goalWidth=
Math.max(
20,
rightX-leftX
);


/*
 * IMPORTANT :
 *
 * Un gros ballon au milieu
 * ne déclenche PAS.
 *
 * Il faut qu'il soit réellement
 * très proche du poteau.
 *
 * La limite dépend de la largeur
 * réelle de la cage détectée.
 */

const closeLimit=
Math.max(
8,
goalWidth*.12
);


/*
 * Vérification verticale.
 *
 * Le ballon doit être à la hauteur
 * de la zone des poteaux.
 */

const averagePostY=
(
left.y+
right.y
)/2;

const verticalDistance=
Math.abs(
ball.y-averagePostY
);

const verticalLimit=
Math.max(
25,
goalWidth*.55
);

const correctHeight=
verticalDistance<
verticalLimit;


/*
 * Vérification supplémentaire :
 *
 * Le ballon doit avoir une taille
 * raisonnable par rapport à la
 * cage, mais cette taille ne peut
 * JAMAIS déclencher le but toute seule.
 */

const ballSize=
Math.max(
ball.width,
ball.height
);

const sizeRatio=
ballSize/
goalWidth;

const closeEnough=
distance<=closeLimit;


/*
 * On demande donc :
 *
 * 1. deux poteaux visibles
 * 2. ballon proche d'un poteau
 * 3. bonne hauteur
 * 4. taille cohérente
 *
 * Le point 4 n'est qu'un filtre,
 * pas le déclencheur.
 */

const near=
closeEnough &&
correctHeight &&
sizeRatio>.01 &&
sizeRatio<.45;


return{

near:near,

distance:distance,

side:side,

goalWidth:goalWidth,

ratio:
Math.min(
1,
distance/
closeLimit
)

};

}


/* =========================
   AFFICHAGE PROXIMITÉ
========================= */

function showProximity(
ball,
proximity
){

if(
!ball ||
!proximity
){

$("proximityIndicator")
.style.display="none";

return;

}


/*
 * Toujours montrer la distance
 * lorsque les poteaux et le
 * ballon sont détectés.
 */

$("proximityIndicator")
.style.display="block";

$("proximityIndicator")
.style.left=
(ball.x/cfg.width*100)+"%";

$("proximityIndicator")
.style.top=
(ball.y/cfg.height*100)+"%";


if(proximity.near){

$("proximityIndicator")
.textContent=
"⚡ COLLÉ AU POTEAU → BUT";

$("proximityIndicator")
.style.background=
"#e74c3ccc";

}else{

const distance=
Math.round(
proximity.distance
);

$("proximityIndicator")
.textContent=
"📏 "+distance+" px du poteau";

$("proximityIndicator")
.style.background=
"#07111fcc";

}

}


/* =========================
   STATUS POTEAUX
========================= */

function updateWallStatus(
left,
right,
proximity
){

if(
cfg.wallDetection==="off"
){

$("wallStatus")
.style.display="none";

return;

}


$("wallStatus")
.style.display="block";


if(
left &&
right
){

if(
proximity &&
proximity.near
){

$("wallStatus")
.textContent=
"🧱 ⚡ BALLON COLLÉ AU POTEAU";

}else{

$("wallStatus")
.textContent=
"🧱 2 POTEAUX DÉTECTÉS";

}

}else if(
left ||
right
){

$("wallStatus")
.textContent=
"🧱 1 POTEAU DÉTECTÉ";

}else{

$("wallStatus")
.textContent=
"🧱 RECHERCHE DES POTEAUX";

}

}


/* =========================
   BUT
========================= */

function triggerGoal(){

const now=
performance.now();

if(
now-lastGoalTime<
1400
){

return;

}

lastGoalTime=
now;


$("goalEffect")
.classList.remove(
"active"
);

$("ball")
.classList.remove(
"goalBall"
);

void $("goalEffect")
.offsetWidth;

void $("ball")
.offsetWidth;


$("goalEffect")
.classList.add(
"active"
);

$("ball")
.classList.add(
"goalBall"
);

setStatus(
"⚽ BUT !"
);


setTimeout(
()=>{

$("goalEffect")
.classList.remove(
"active"
);

$("ball")
.classList.remove(
"goalBall"
);

if(playing){

setStatus(
"CAMÉRA : ON"
);

}

},
1000
);

}


/* =========================
   GARDIEN
========================= */

function updateKeeper(
x,
y
){

const percentX=
(
1-
x/cfg.width
)*100;

const keeperPosition=
Math.max(
8,
Math.min(
92,
percentX
)
);

$("keeper")
.style.left=
keeperPosition+
"%";


const ballX=
8+
(x/cfg.width)*84;

const ballY=
48+
(y/cfg.height)*40;

$("ball")
.style.left=
ballX+
"%";

$("ball")
.style.top=
ballY+
"%";


$("keeper")
.classList.remove(
"dive-left",
"dive-right"
);

const center=
cfg.width/2;

if(
x<center-90
){

$("keeper")
.classList.add(
"dive-left"
);

}else if(
x>center+90
){

$("keeper")
.classList.add(
"dive-right"
);

}

}


/* =========================
   TRACKING PRINCIPAL
========================= */

function startTracking(){

if(trackingTimer){

cancelAnimationFrame(
trackingTimer
);

}


const canvas=
$("trackCanvas");

const ctx=
canvas.getContext(
"2d",
{
willReadFrequently:true
}
);

canvas.width=
cfg.width;

canvas.height=
cfg.height;


function loop(){

if(
!playing ||
!stream
){

return;

}

const video=
$("camera");


if(
video.readyState>=2
){

ctx.drawImage(
video,
0,
0,
cfg.width,
cfg.height
);


const image=
ctx.getImageData(
0,
0,
cfg.width,
cfg.height
);

const data=
image.data;


/*
 * ======================
 * 1. POTEAUX
 * ======================
 */

let leftPost=null;
let rightPost=null;


if(
cfg.wallDetection==="on"
){

leftPost=
detectPost(
data,
cfg.width,
cfg.height,
colorHsv(
cfg.leftPostColor
),
"left"
);

rightPost=
detectPost(
data,
cfg.width,
cfg.height,
colorHsv(
cfg.rightPostColor
),
"right"
);

}


showPostBox(
$("leftPostBox"),
leftPost,
cfg.leftPostColor
);

showPostBox(
$("rightPostBox"),
rightPost,
cfg.rightPostColor
);

updateGoalTrackingLine(
leftPost,
rightPost
);


/*
 * ======================
 * 2. BALLON
 * ======================
 */

const ball=
detectBall(
data,
cfg.width,
cfg.height
);


if(ball){

/*
 * Carré réel autour
 * de l'objet.
 */

showTrackBox(
ball
);


/*
 * Gardien.
 */

updateKeeper(
ball.x,
ball.y
);


/*
 * ======================
 * 3. PROXIMITÉ
 * ======================
 */

const proximity=
calculateWallProximity(
ball,
leftPost,
rightPost
);

showProximity(
ball,
proximity
);

updateWallStatus(
leftPost,
rightPost,
proximity
);


/*
 * ======================
 * 4. BUT
 * ======================
 *
 * GROS ≠ BUT.
 *
 * Le but dépend surtout de
 * la distance du ballon au
 * poteau détecté.
 */

if(
cfg.wallDetection==="on" &&
proximity.near
){

triggerGoal();

}

}else{

$("trackBox")
.style.display="none";

$("proximityIndicator")
.style.display="none";

updateWallStatus(
leftPost,
rightPost,
null
);

}

}


trackingTimer=
requestAnimationFrame(
loop
);

}


loop();

}
