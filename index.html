<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projector Tracking</title>

<style>
*{box-sizing:border-box}
html,body{
margin:0;width:100%;height:100%;overflow:hidden;
font-family:Arial,sans-serif;background:#07111f;color:white
}
#app{position:relative;width:100%;height:100%;overflow:hidden}

/* STADE */
#stadium{position:absolute;inset:0;overflow:hidden}
.sky{position:absolute;inset:0 0 48%;background:linear-gradient(#06152b,#245a82)}
.lights{
position:absolute;top:8%;left:50%;transform:translateX(-50%);
width:80%;height:12%;
background:radial-gradient(ellipse,#ffffff 0 4%,transparent 5% 100%);
opacity:.8
}
.crowd{
position:absolute;left:0;right:0;top:25%;height:24%;
background:repeating-linear-gradient(90deg,#18283a 0 8px,#30465a 8px 16px,#172437 16px 24px)
}
.pitch{
position:absolute;left:-10%;right:-10%;bottom:-8%;height:58%;
background:linear-gradient(#267b2e,#1b5e24);
transform:perspective(700px) rotateX(12deg);
transform-origin:bottom
}

/* BUT */
#goal{
position:absolute;left:50%;top:30%;
width:min(76vw,760px);height:min(42vh,390px);
transform:translateX(-50%);
border:12px solid #eeeeee;border-bottom-width:18px;
box-shadow:0 0 35px #0008;
background:linear-gradient(90deg,#ffffff12,#ffffff03);
transition:filter .2s
}
#goal::before{
content:"";position:absolute;inset:0;
background:
repeating-linear-gradient(90deg,transparent 0 34px,#fff5 35px 37px),
repeating-linear-gradient(0deg,transparent 0 34px,#fff5 35px 37px);
opacity:.45
}
#goal.goalHit{
animation:goalHit .8s ease;
}
@keyframes goalHit{
0%{filter:brightness(1)}
30%{filter:brightness(3) drop-shadow(0 0 40px #fff)}
100%{filter:brightness(1)}
}

/* GARDIEN */
#keeper{
position:absolute;left:50%;top:56%;
width:86px;height:150px;
transform:translate(-50%,-50%);
transition:left .08s linear,transform .18s ease;
z-index:4
}
#keeper .head{
width:42px;height:42px;border-radius:50%;
background:#f0bd8a;margin:auto;position:relative;z-index:2
}
#keeper .head::after{
content:"";position:absolute;left:7px;right:7px;top:8px;height:10px;
background:#3b2419;border-radius:50%
}
#keeper .body{
width:62px;height:82px;background:#e7c51d;
border-radius:18px 18px 8px 8px;margin:-3px auto 0;
box-shadow:inset 0 -10px #c7a817
}
#keeper .arm{
position:absolute;top:50px;width:24px;height:76px;
background:#e7c51d;border-radius:20px;
transform-origin:top center;
transition:transform .12s ease
}
#keeper .arm.l{left:0;transform:rotate(25deg)}
#keeper .arm.r{right:0;transform:rotate(-25deg)}
#keeper .leg{
position:absolute;top:119px;width:24px;height:62px;
background:#182333;border-radius:12px
}
#keeper .leg.l{left:20px}
#keeper .leg.r{right:20px}

#keeper.dive-left{
transform:translate(-50%,-50%) rotate(-18deg) scale(1.08)
}
#keeper.dive-right{
transform:translate(-50%,-50%) rotate(18deg) scale(1.08)
}
#keeper.dive-left .arm.l{transform:rotate(-70deg)}
#keeper.dive-right .arm.r{transform:rotate(70deg)}

/* BALLON */
#ball{
position:absolute;left:50%;top:75%;width:30px;height:30px;
border-radius:50%;background:white;
box-shadow:0 2px 8px #0008;
transform:translate(-50%,-50%);
z-index:5;
transition:left .12s linear,top .12s linear
}
#ball.goalBall{
animation:ballGoal .65s ease forwards
}
@keyframes ballGoal{
0%{transform:translate(-50%,-50%) scale(1)}
70%{transform:translate(-50%,-50%) scale(1.7)}
100%{transform:translate(-50%,-50%) scale(.8);opacity:0}
}

/* EFFET BUT */
#goalEffect{
position:absolute;inset:0;z-index:30;
display:none;align-items:center;justify-content:center;
background:rgba(255,255,255,0);
pointer-events:none
}
#goalEffect.active{
display:flex;animation:goalFlash .9s ease
}
#goalText{
font-size:clamp(60px,15vw,150px);
font-weight:900;
text-shadow:0 8px 30px #000;
transform:scale(.5);
}
#goalEffect.active #goalText{
animation:goalText .9s cubic-bezier(.2,1.5,.3,1)
}
@keyframes goalFlash{
0%{background:rgba(255,255,255,.9)}
25%{background:rgba(255,215,0,.25)}
100%{background:rgba(255,255,255,0)}
}
@keyframes goalText{
0%{transform:scale(.3) rotate(-8deg);opacity:0}
35%{transform:scale(1.2) rotate(3deg);opacity:1}
100%{transform:scale(1) rotate(0);opacity:1}
}

/* HUD */
#hud{
position:absolute;top:16px;left:16px;right:16px;
display:flex;justify-content:space-between;z-index:10;
pointer-events:none
}
.badge{background:#07111fcc;padding:10px 14px;border-radius:12px}

/* MENU */
#menu,#settings{
position:absolute;z-index:20;inset:0;
display:flex;align-items:center;justify-content:center;
background:#03101dcc;backdrop-filter:blur(6px)
}
.panel{
width:min(92vw,520px);max-height:92vh;overflow:auto;
background:#0b1726ee;border:1px solid #ffffff22;
border-radius:22px;padding:26px;
box-shadow:0 20px 60px #0008
}
h1{margin:0 0 8px;font-size:clamp(30px,7vw,56px)}
h2{margin-top:0}
.sub{opacity:.75;margin:0 0 22px}
.actions{display:grid;gap:12px}
button{
cursor:pointer;border:0;border-radius:12px;
padding:14px 20px;font-weight:700
}
.primary{background:#2ed573;color:#06140b}
.secondary{background:white;color:#07111f}
.dark{background:#203247;color:white}

/* SETTINGS */
.row{
display:flex;gap:10px;align-items:center;
justify-content:space-between;margin:16px 0;flex-wrap:wrap
}
.row label{font-weight:700}
input[type="color"]{width:70px;height:42px;padding:2px}
input[type="range"]{width:180px}
select{
background:#17283b;color:white;border:1px solid #ffffff22;
border-radius:10px;padding:10px;max-width:100%
}

/* CAMERA */
#cameraPanel{
position:absolute;right:16px;bottom:16px;
width:min(34vw,360px);min-width:210px;
aspect-ratio:4/3;background:black;
border:2px solid #ffffff55;border-radius:14px;
overflow:hidden;z-index:12
}
#camera{
width:100%;height:100%;object-fit:cover;
transform:scaleX(-1)
}
#trackCanvas{display:none}
#trackBox{
position:absolute;width:55px;height:55px;
border:2px solid #2ed573;border-radius:8px;
display:none;transform:translate(-50%,-50%);
z-index:13;pointer-events:none
}
#wallBox{
position:absolute;
left:50%;top:50%;
width:70%;height:55%;
transform:translate(-50%,-50%);
border:2px dashed #00d9ff;
border-radius:20px;
display:none;
z-index:11;
pointer-events:none;
box-shadow:0 0 20px #00d9ff55
}
#wallStatus{
position:absolute;
left:50%;bottom:8px;
transform:translateX(-50%);
background:#07111fcc;
padding:6px 10px;
border-radius:8px;
font-size:12px;
display:none;
z-index:14;
white-space:nowrap
}
#status{font-size:13px;opacity:.8;margin-top:14px;min-height:18px}
.hidden{display:none!important}

@media(max-width:650px){
#goal{top:31%;height:35vh;border-width:8px}
#keeper{transform:translate(-50%,-50%) scale(.75)}
#cameraPanel{width:42vw;min-width:150px}
.panel{padding:20px}
}
</style>
</head>

<body>

<div id="app">

<div id="stadium">
<div class="sky"></div>
<div class="lights"></div>
<div class="crowd"></div>
<div class="pitch"></div>
</div>

<div id="goal"></div>

<div id="keeper">
<div class="head"></div>
<div class="body"></div>
<div class="arm l"></div>
<div class="arm r"></div>
<div class="leg l"></div>
<div class="leg r"></div>
</div>

<div id="ball"></div>

<div id="hud">
<div class="badge">⚽ PROJECTOR TRACKING</div>
<div class="badge" id="hudStatus">CAMÉRA : OFF</div>
</div>

<div id="trackBox"></div>
<div id="wallBox"></div>
<div id="wallStatus">🧱 MUR : DISTANCE OK</div>

<div id="cameraPanel" class="hidden">
<video id="camera" autoplay playsinline muted></video>
</div>

<canvas id="trackCanvas"></canvas>

<div id="goalEffect">
<div id="goalText">⚽ BUT !</div>
</div>

<section id="menu">
<div class="panel">

<h1>
PROJECTOR<br>
GOALKEEPER
</h1>

<p class="sub">
Jeu de gardien avec tracking couleur par caméra.
</p>

<div class="actions">

<button id="startBtn" class="primary">
▶ START GAME
</button>

<button id="cameraBtn" class="secondary">
📷 CONNECT TO CAMERA
</button>

<button id="settingsBtn" class="dark">
⚙ SETTINGS
</button>

</div>

<div id="status"></div>

</div>
</section>

<section id="settings" class="hidden">

<div class="panel">

<h2>⚙ SETTINGS</h2>

<div class="row">
<label>Caméra</label>
<select id="cameraSelect">
<option value="auto">🔄 Automatique</option>
</select>
</div>

<div class="row">
<label>Type caméra</label>
<select id="cameraType">
<option value="environment">📷 Arrière</option>
<option value="user">🤳 Frontale</option>
<option value="any">🔌 USB / Autre</option>
</select>
</div>

<div class="row">
<label>Résolution caméra</label>
<select id="resolution">
<option value="320x240">320×240</option>
<option value="640x480" selected>640×480</option>
<option value="1280x720">1280×720</option>
<option value="1920x1080">1920×1080</option>
</select>
</div>

<div class="row">
<label>Couleur cible</label>
<input id="color" type="color" value="#ff0000">
</div>

<div class="row">
<label>Tolérance <span id="tolVal">75</span></label>
<input id="tolerance" type="range" min="10" max="150" value="75">
</div>

<div class="row">
<label>Tracking</label>
<select id="tracking">
<option value="ball">Objet coloré</option>
<option value="bright">Objet lumineux</option>
</select>
</div>

<div class="row">
<label>Détection du mur</label>
<select id="wallDetection">
<option value="on">ON</option>
<option value="off">OFF</option>
</select>
</div>

<div class="row">
<label>Sensibilité mur</label>
<input id="wallSensitivity" type="range" min="20" max="90" value="65">
</div>

<div class="row">
<label>Aperçu caméra</label>
<select id="preview">
<option value="on">ON</option>
<option value="off">OFF</option>
</select>
</div>

<div class="actions">
<button id="applyBtn" class="primary">APPLY</button>
<button id="refreshCamerasBtn" class="secondary">🔄 ACTUALISER CAMÉRAS</button>
<button id="backBtn" class="dark">BACK</button>
</div>

</div>
</section>

</div>

<script>

const cfg = {

width:640,
height:480,
color:"#ff0000",
tolerance:75,
tracking:"ball",
preview:"on",

cameraId:"",
cameraType:"environment",

wallDetection:"on",
wallSensitivity:65

};

let stream=null;
let trackingTimer=null;
let playing=false;
let lastGoalTime=0;
let cameraList=[];


/* DOM */

const $=id=>document.getElementById(id);


/* STATUS */

function setStatus(text){

$("status").textContent=text;

$("hudStatus").textContent=text.toUpperCase();

}


/* RGB HSV */

function rgbToHsv(r,g,b){

r/=255;
g/=255;
b/=255;

const max=Math.max(r,g,b);
const min=Math.min(r,g,b);
const d=max-min;

let h=0;

if(d){

if(max===r){

h=((g-b)/d)%6;

}else if(max===g){

h=(b-r)/d+2;

}else{

h=(r-g)/d+4;

}

h*=60;

if(h<0)h+=360;

}

return[
h,
max?d/max:0,
max
];

}


/* HEX RGB */

function hexRgb(hex){

return[
parseInt(hex.slice(1,3),16),
parseInt(hex.slice(3,5),16),
parseInt(hex.slice(5,7),16)
];

}


/* TARGET */

function targetHsv(){

const[r,g,b]=hexRgb(cfg.color);

return rgbToHsv(r,g,b);

}


/* =========================
   CAMÉRAS DISPONIBLES
========================= */

async function loadCameras(){

if(!navigator.mediaDevices ||
!navigator.mediaDevices.enumerateDevices){

return;

}

try{

const devices=
await navigator.mediaDevices.enumerateDevices();

cameraList=
devices.filter(
device=>device.kind==="videoinput"
);

const select=$("cameraSelect");

select.innerHTML=
'<option value="auto">🔄 Automatique</option>';

cameraList.forEach((device,index)=>{

const option=document.createElement("option");

option.value=device.deviceId;

let name=device.label;

if(!name){

name="Caméra "+(index+1);

}

option.textContent="📷 "+name;

select.appendChild(option);

});

if(cfg.cameraId){

select.value=cfg.cameraId;

}

}catch(error){

console.error(error);

}

}


/* =========================
   OUVRIR CAMERA
========================= */

async function openCamera(){

stopCamera();

let videoConstraints={

width:{ideal:cfg.width},
height:{ideal:cfg.height}

};


/*
 * Si l'utilisateur a choisi
 * une caméra précise.
 */

if(cfg.cameraId){

videoConstraints.deviceId={
exact:cfg.cameraId
};

}else if(cfg.cameraType!=="any"){

videoConstraints.facingMode={
ideal:cfg.cameraType
};

}

try{

const cameraStream=
await navigator.mediaDevices.getUserMedia({

audio:false,
video:videoConstraints

});

stream=cameraStream;

$("camera").srcObject=stream;

$("cameraPanel").classList.toggle(
"hidden",
cfg.preview==="off"
);

playing=true;

const track=
stream.getVideoTracks()[0];

const settings=
track.getSettings();

if(settings.deviceId){

cfg.cameraId=settings.deviceId;

$("cameraSelect").value=
settings.deviceId;

}

setStatus("CAMÉRA : ON");

await loadCameras();

startTracking();

}catch(error){

console.error(error);

playing=false;

setStatus("CAMÉRA REFUSÉE / INDISPONIBLE");

}

}


/* =========================
   PERMISSION
========================= */

async function requestCameraPermission(){

if(!navigator.mediaDevices ||
!navigator.mediaDevices.getUserMedia){

setStatus("HTTPS OU NAVIGATEUR NON COMPATIBLE");

return;

}

try{

const tempStream=
await navigator.mediaDevices.getUserMedia({

video:true,
audio:false

});

tempStream.getTracks().forEach(
track=>track.stop()
);

await loadCameras();

openCamera();

}catch(error){

console.error(error);

setStatus("AUTORISATION CAMÉRA REFUSÉE");

}

}


/* =========================
   STOP CAMERA
========================= */

function stopCamera(){

if(stream){

stream.getTracks().forEach(
track=>track.stop()
);

stream=null;

}

$("camera").srcObject=null;

if(trackingTimer){

cancelAnimationFrame(trackingTimer);

trackingTimer=null;

}

}


/* =========================
   DETECTION MUR
========================= */

function detectWall(data,width,height){

if(cfg.wallDetection==="off"){

$("wallBox").style.display="none";
$("wallStatus").style.display="none";

return false;

}


/*
 * Estimation de proximité :
 *
 * On analyse les bords et les zones
 * de forte occupation de l'image.
 *
 * Plus la zone détectée occupe
 * l'image, plus on considère que
 * l'objet/mur est proche.
 */

const step=8;

let bright=0;
let edges=0;
let total=0;

for(let y=0;y<height;y+=step){

for(let x=0;x<width;x+=step){

const i=(y*width+x)*4;

const r=data[i];
const g=data[i+1];
const b=data[i+2];

const brightness=(r+g+b)/3;

if(brightness>150){

bright++;

}

if(
x>0 &&
y>0
){

const pi=(y*width+(x-step))*4;
const prev=(data[pi]+data[pi+1]+data[pi+2])/3;

if(Math.abs(brightness-prev)>45){

edges++;

}

}

total++;

}

}

const brightRatio=bright/total;
const edgeRatio=edges/total;


/*
 * Sensibilité :
 * 65 par défaut.
 */

const threshold=
0.30-(cfg.wallSensitivity/1000);

const nearWall=
brightRatio>threshold ||
edgeRatio>0.20;


/*
 * Affichage indicateur.
 */

if(nearWall){

$("wallBox").style.display="block";
$("wallStatus").style.display="block";
$("wallStatus").textContent="🧱 MUR PROCHE → IMPACT";

}else{

$("wallBox").style.display="none";
$("wallStatus").style.display="none";

}

return nearWall;

}


/* =========================
   BUT
========================= */

function triggerGoal(){

const now=performance.now();

if(now-lastGoalTime<1400){

return;

}

lastGoalTime=now;

$("goal").classList.remove("goalHit");
$("ball").classList.remove("goalBall");
$("goalEffect").classList.remove("active");

void $("goal").offsetWidth;
void $("goalEffect").offsetWidth;

$("goal").classList.add("goalHit");
$("ball").classList.add("goalBall");
$("goalEffect").classList.add("active");

setStatus("⚽ BUT !");

setTimeout(()=>{

$("goalEffect").classList.remove("active");

if(playing){

setStatus("CAMÉRA : ON");

}

$("ball").classList.remove("goalBall");

},1000);

}


/* =========================
   GARDIEN
========================= */

function updateKeeper(x,y){

const percentX=
(1-x/cfg.width)*100;

const keeperPosition=
Math.max(
8,
Math.min(
92,
percentX
)
);

$("keeper").style.left=
keeperPosition+"%";


/*
 * Déplacement du ballon
 * vers la position détectée.
 */

const ballX=
8+(x/cfg.width)*84;

const ballY=
48+(y/cfg.height)*40;

$("ball").style.left=
ballX+"%";

$("ball").style.top=
ballY+"%";


/*
 * Plongeon selon direction.
 */

const center=
cfg.width/2;

$("keeper").classList.remove(
"dive-left",
"dive-right"
);

if(x<center-90){

$("keeper").classList.add(
"dive-left"
);

}else if(x>center+90){

$("keeper").classList.add(
"dive-right"
);

}

}


/* =========================
   TRACKING
========================= */

function startTracking(){

if(trackingTimer){

cancelAnimationFrame(
trackingTimer
);

}

const canvas=$("trackCanvas");

const ctx=canvas.getContext(
"2d",
{willReadFrequently:true}
);

canvas.width=cfg.width;
canvas.height=cfg.height;

function loop(){

if(!playing || !stream){

return;

}

const video=$("camera");

if(video.readyState>=2){

ctx.drawImage(
video,
0,
0,
cfg.width,
cfg.height
);

const image=
ctx.getImageData(
0,
0,
cfg.width,
cfg.height
);

const data=image.data;


/*
 * Mur d'abord.
 */

const nearWall=
detectWall(
data,
cfg.width,
cfg.height
);


/*
 * Tracking couleur.
 */

let sx=0;
let sy=0;
let count=0;

const[
targetH,
targetS,
targetV
]=targetHsv();

const step=4;

for(
let y=0;
y<cfg.height;
y+=step
){

for(
let x=0;
x<cfg.width;
x+=step
){

const i=
(y*cfg.width+x)*4;

const r=data[i];
const g=data[i+1];
const b=data[i+2];

if(cfg.tracking==="bright"){

if(r+g+b>690){

sx+=x;
sy+=y;
count++;

}

}else{

const[
h,
s,
v
]=rgbToHsv(
r,g,b
);

let dh=
Math.abs(h-targetH);

dh=Math.min(
dh,
360-dh
);

if(

dh<cfg.tolerance &&
Math.abs(s-targetS)<.55 &&
v>.18

){

sx+=x;
sy+=y;
count++;

}

}

}

}


if(count>8){

const x=sx/count;
const y=sy/count;

updateKeeper(x,y);

$("trackBox").style.display=
"block";

$("trackBox").style.left=
(x/cfg.width*100)+"%";

$("trackBox").style.top=
(y/cfg.height*100)+"%";


/*
 * Si le tracking est proche
 * du mur, on déclenche le but.
 *
 * La condition de position évite
 * qu'un élément hors de la cage
 * déclenche immédiatement le but.
 */

const goalLeft=
cfg.width*0.15;

const goalRight=
cfg.width*0.85;

const goalTop=
cfg.height*0.18;

const goalBottom=
cfg.height*0.80;

const insideGoal=
x>goalLeft &&
x<goalRight &&
y>goalTop &&
y<goalBottom;

if(
nearWall &&
insideGoal
){

triggerGoal();

}

}else{

$("trackBox").style.display="none";

}

}

trackingTimer=
requestAnimationFrame(loop);

}

loop();

}


/* =========================
   START
========================= */

$("startBtn").addEventListener(
"click",
()=>{

$("menu").classList.add("hidden");

requestCameraPermission();

}
);


/* =========================
   CAMERA
========================= */

$("cameraBtn").addEventListener(
"click",
()=>{

requestCameraPermission();

}
);


/* =========================
   SETTINGS
========================= */

$("settingsBtn").addEventListener(
"click",
async()=>{

$("menu").classList.add("hidden");

$("settings").classList.remove("hidden");

await loadCameras();

}
);


/* =========================
   CHOIX CAMERA
========================= */

$("cameraSelect").addEventListener(
"change",
event=>{

cfg.cameraId=event.target.value;

}
);


$("cameraType").addEventListener(
"change",
event=>{

cfg.cameraType=event.target.value;

if(cfg.cameraType!=="any"){

cfg.cameraId="";

$("cameraSelect").value="auto";

}

}
);


/* =========================
   TOLERANCE
========================= */

$("tolerance").addEventListener(
"input",
event=>{

$("tolVal").textContent=
event.target.value;

}
);


/* =========================
   REFRESH CAMERAS
========================= */

$("refreshCamerasBtn").addEventListener(
"click",
async()=>{

await loadCameras();

setStatus("CAMÉRAS ACTUALISÉES");

}
);


/* =========================
   APPLY
========================= */

$("applyBtn").addEventListener(
"click",
()=>{

const[
width,
height
]=
$("resolution")
.value
.split("x")
.map(Number);
