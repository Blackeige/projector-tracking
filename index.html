<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projector Tracking</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #07111f;
    color: white;
}

#app {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

/* =========================
   STADE
========================= */

#stadium {
    position: absolute;
    inset: 0;
    overflow: hidden;
}

.sky {
    position: absolute;
    inset: 0 0 48%;
    background: linear-gradient(#06152b, #245a82);
}

.lights {
    position: absolute;
    top: 8%;
    left: 50%;
    transform: translateX(-50%);
    width: 80%;
    height: 12%;
    background: radial-gradient(
        ellipse,
        #ffffff 0 4%,
        transparent 5% 100%
    );
    opacity: .8;
}

.crowd {
    position: absolute;
    left: 0;
    right: 0;
    top: 25%;
    height: 24%;

    background:
        repeating-linear-gradient(
            90deg,
            #18283a 0 8px,
            #30465a 8px 16px,
            #172437 16px 24px
        );
}

.pitch {
    position: absolute;
    left: -10%;
    right: -10%;
    bottom: -8%;
    height: 58%;

    background: linear-gradient(
        #267b2e,
        #1b5e24
    );

    transform:
        perspective(700px)
        rotateX(12deg);

    transform-origin: bottom;
}

/* =========================
   BUT
========================= */

#goal {
    position: absolute;

    left: 50%;
    top: 30%;

    width: min(76vw, 760px);
    height: min(42vh, 390px);

    transform: translateX(-50%);

    border: 12px solid #eeeeee;
    border-bottom-width: 18px;

    box-shadow:
        0 0 35px #0008;

    background:
        linear-gradient(
            90deg,
            #ffffff12,
            #ffffff03
        );
}

#goal::before {
    content: "";

    position: absolute;
    inset: 0;

    background:
        repeating-linear-gradient(
            90deg,
            transparent 0 34px,
            #fff5 35px 37px
        ),
        repeating-linear-gradient(
            0deg,
            transparent 0 34px,
            #fff5 35px 37px
        );

    opacity: .45;
}

/* =========================
   GARDIEN
========================= */

#keeper {
    position: absolute;

    left: 50%;
    top: 56%;

    width: 86px;
    height: 150px;

    transform: translate(-50%, -50%);

    transition:
        left .08s linear;

    z-index: 4;
}

#keeper .head {
    width: 42px;
    height: 42px;

    border-radius: 50%;

    background: #f0bd8a;

    margin: auto;

    position: relative;
    z-index: 2;
}

#keeper .body {
    width: 62px;
    height: 82px;

    background: #e7c51d;

    border-radius:
        18px 18px
        8px 8px;

    margin: -3px auto 0;
}

#keeper .arm {
    position: absolute;

    top: 50px;

    width: 24px;
    height: 76px;

    background: #e7c51d;

    border-radius: 20px;
}

#keeper .arm.l {
    left: 0;
    transform: rotate(25deg);
}

#keeper .arm.r {
    right: 0;
    transform: rotate(-25deg);
}

#keeper .leg {
    position: absolute;

    top: 119px;

    width: 24px;
    height: 62px;

    background: #182333;

    border-radius: 12px;
}

#keeper .leg.l {
    left: 20px;
}

#keeper .leg.r {
    right: 20px;
}

/* =========================
   BALLON
========================= */

#ball {
    position: absolute;

    left: 50%;
    top: 75%;

    width: 30px;
    height: 30px;

    border-radius: 50%;

    background: white;

    box-shadow:
        0 2px 8px #0008;

    transform:
        translate(-50%, -50%);

    z-index: 5;
}

/* =========================
   HUD
========================= */

#hud {
    position: absolute;

    top: 16px;
    left: 16px;
    right: 16px;

    display: flex;
    justify-content: space-between;

    z-index: 10;

    pointer-events: none;
}

.badge {
    background: #07111fcc;

    padding: 10px 14px;

    border-radius: 12px;
}

/* =========================
   MENU
========================= */

#menu,
#settings {
    position: absolute;

    z-index: 20;

    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #03101dcc;

    backdrop-filter: blur(6px);
}

.panel {
    width: min(92vw, 520px);
    max-height: 92vh;

    overflow: auto;

    background: #0b1726ee;

    border:
        1px solid
        #ffffff22;

    border-radius: 22px;

    padding: 26px;

    box-shadow:
        0 20px 60px #0008;
}

h1 {
    margin: 0 0 8px;

    font-size:
        clamp(
            30px,
            7vw,
            56px
        );
}

h2 {
    margin-top: 0;
}

.sub {
    opacity: .75;

    margin:
        0 0 22px;
}

.actions {
    display: grid;

    gap: 12px;
}

button {
    cursor: pointer;

    border: 0;

    border-radius: 12px;

    padding: 14px 20px;

    font-weight: 700;
}

.primary {
    background: #2ed573;
    color: #06140b;
}

.secondary {
    background: white;
    color: #07111f;
}

.dark {
    background: #203247;
    color: white;
}

/* =========================
   SETTINGS
========================= */

.row {
    display: flex;

    gap: 10px;

    align-items: center;

    justify-content: space-between;

    margin: 16px 0;

    flex-wrap: wrap;
}

.row label {
    font-weight: 700;
}

input[type="color"] {
    width: 70px;
    height: 42px;

    padding: 2px;
}

input[type="range"] {
    width: 180px;
}

select {
    background: #17283b;

    color: white;

    border:
        1px solid
        #ffffff22;

    border-radius: 10px;

    padding: 10px;
}

/* =========================
   CAMERA
========================= */

#cameraPanel {
    position: absolute;

    right: 16px;
    bottom: 16px;

    width: min(34vw, 360px);

    min-width: 210px;

    aspect-ratio: 4 / 3;

    background: black;

    border:
        2px solid
        #ffffff55;

    border-radius: 14px;

    overflow: hidden;

    z-index: 12;
}

#camera {
    width: 100%;
    height: 100%;

    object-fit: cover;

    transform: scaleX(-1);
}

#trackCanvas {
    display: none;
}

#trackBox {
    position: absolute;

    width: 55px;
    height: 55px;

    border:
        2px solid
        #2ed573;

    border-radius: 8px;

    display: none;

    transform:
        translate(-50%, -50%);

    z-index: 13;

    pointer-events: none;
}

#status {
    font-size: 13px;

    opacity: .8;

    margin-top: 14px;

    min-height: 18px;
}

.hidden {
    display: none !important;
}

/* =========================
   MOBILE
========================= */

@media(max-width:650px) {

    #goal {
        top: 31%;
        height: 35vh;
        border-width: 8px;
    }

    #keeper {
        transform:
            translate(-50%, -50%)
            scale(.75);
    }

    #cameraPanel {
        width: 42vw;
        min-width: 150px;
    }

    .panel {
        padding: 20px;
    }
}
</style>
</head>

<body>

<div id="app">

    <!-- STADE -->
    <div id="stadium">
        <div class="sky"></div>
        <div class="lights"></div>
        <div class="crowd"></div>
        <div class="pitch"></div>
    </div>

    <!-- BUT -->
    <div id="goal"></div>

    <!-- GARDIEN -->
    <div id="keeper">

        <div class="head"></div>

        <div class="body"></div>

        <div class="arm l"></div>
        <div class="arm r"></div>

        <div class="leg l"></div>
        <div class="leg r"></div>

    </div>

    <!-- BALLON -->
    <div id="ball"></div>

    <!-- HUD -->
    <div id="hud">

        <div class="badge">
            ⚽ PROJECTOR TRACKING
        </div>

        <div
            class="badge"
            id="hudStatus"
        >
            CAMÉRA : OFF
        </div>

    </div>

    <!-- ZONE DE TRACKING -->
    <div id="trackBox"></div>

    <!-- CAMERA -->
    <div
        id="cameraPanel"
        class="hidden"
    >
        <video
            id="camera"
            autoplay
            playsinline
            muted
        ></video>
    </div>

    <!-- CANVAS ANALYSE -->
    <canvas id="trackCanvas"></canvas>


    <!-- =========================
         MENU PRINCIPAL
    ========================== -->

    <section id="menu">

        <div class="panel">

            <h1>
                PROJECTOR<br>
                GOALKEEPER
            </h1>

            <p class="sub">
                Jeu de gardien avec
                tracking couleur par caméra.
            </p>

            <div class="actions">

                <button
                    id="startBtn"
                    class="primary"
                >
                    ▶ START GAME
                </button>

                <button
                    id="cameraBtn"
                    class="secondary"
                >
                    📷 CONNECT TO CAMERA
                </button>

                <button
                    id="settingsBtn"
                    class="dark"
                >
                    ⚙ SETTINGS
                </button>

            </div>

            <div id="status"></div>

        </div>

    </section>


    <!-- =========================
         PARAMÈTRES
    ========================== -->

    <section
        id="settings"
        class="hidden"
    >

        <div class="panel">

            <h2>
                ⚙ SETTINGS
            </h2>

            <div class="row">

                <label>
                    Résolution caméra
                </label>

                <select id="resolution">

                    <option value="320x240">
                        320×240
                    </option>

                    <option
                        value="640x480"
                        selected
                    >
                        640×480
                    </option>

                    <option value="1280x720">
                        1280×720
                    </option>

                    <option value="1920x1080">
                        1920×1080
                    </option>

                </select>

            </div>


            <div class="row">

                <label>
                    Couleur cible
                </label>

                <input
                    id="color"
                    type="color"
                    value="#ff0000"
                >

            </div>


            <div class="row">

                <label>
                    Tolérance
                    <span id="tolVal">
                        75
                    </span>
                </label>

                <input
                    id="tolerance"
                    type="range"
                    min="10"
                    max="150"
                    value="75"
                >

            </div>


            <div class="row">

                <label>
                    Tracking
                </label>

                <select id="tracking">

                    <option value="ball">
                        Objet coloré
                    </option>

                    <option value="bright">
                        Objet lumineux
                    </option>

                </select>

            </div>


            <div class="row">

                <label>
                    Aperçu caméra
                </label>

                <select id="preview">

                    <option value="on">
                        ON
                    </option>

                    <option value="off">
                        OFF
                    </option>

                </select>

            </div>


            <div class="actions">

                <button
                    id="applyBtn"
                    class="primary"
                >
                    APPLY
                </button>

                <button
                    id="backBtn"
                    class="dark"
                >
                    BACK
                </button>

            </div>

        </div>

    </section>

</div>


<script>

/* =========================
   CONFIGURATION
========================= */

const cfg = {

    width: 640,

    height: 480,

    color: "#ff0000",

    tolerance: 75,

    tracking: "ball",

    preview: "on"

};


let stream = null;

let trackingTimer = null;

let playing = false;


/* =========================
   RACCOURCI DOM
========================= */

const $ = id =>
    document.getElementById(id);


/* =========================
   STATUS
========================= */

function setStatus(text) {

    $("status").textContent = text;

    $("hudStatus").textContent =
        text.toUpperCase();

}


/* =========================
   RGB → HSV
========================= */

function rgbToHsv(r, g, b) {

    r /= 255;
    g /= 255;
    b /= 255;

    const max =
        Math.max(r, g, b);

    const min =
        Math.min(r, g, b);

    const d =
        max - min;

    let h = 0;

    if (d) {

        if (max === r) {

            h =
                ((g - b) / d) % 6;

        } else if (max === g) {

            h =
                (b - r) / d + 2;

        } else {

            h =
                (r - g) / d + 4;

        }

        h *= 60;

        if (h < 0) {
            h += 360;
        }

    }

    return [

        h,

        max ?
            d / max :
            0,

        max

    ];

}


/* =========================
   HEX → RGB
========================= */

function hexRgb(hex) {

    return [

        parseInt(
            hex.slice(1, 3),
            16
        ),

        parseInt(
            hex.slice(3, 5),
            16
        ),

        parseInt(
            hex.slice(5, 7),
            16
        )

    ];

}


/* =========================
   COULEUR CIBLE
========================= */

function targetHsv() {

    const [
        r,
        g,
        b
    ] = hexRgb(cfg.color);

    return rgbToHsv(
        r,
        g,
        b
    );

}


/* =========================
   OUVRIR CAMERA
========================= */

function openCamera() {

    stopCamera();

    const constraints = {

        audio: false,

        video: {

            width: {
                ideal: cfg.width
            },

            height: {
                ideal: cfg.height
            },

            facingMode:
                "environment"

        }

    };


    navigator.mediaDevices
        .getUserMedia(constraints)

        .then(cameraStream => {

            stream =
                cameraStream;

            $("camera").srcObject =
                cameraStream;

            $("cameraPanel")
                .classList.toggle(
                    "hidden",
                    cfg.preview === "off"
                );

            playing = true;

            setStatus(
                "CAMÉRA : ON"
            );

            startTracking();

        })

        .catch(error => {

            playing = false;

            setStatus(
                "CAMÉRA REFUSÉE / INDISPONIBLE"
            );

            console.error(error);

        });

}


/* =========================
   PERMISSION CAMERA
========================= */

function requestCameraPermission() {

    if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ) {

        setStatus(
            "HTTPS OU NAVIGATEUR NON COMPATIBLE"
        );

        return;

    }


    navigator.mediaDevices
        .getUserMedia({

            video: true,

            audio: false

        })

        .then(tempStream => {

            tempStream
                .getTracks()
                .forEach(
                    track =>
                        track.stop()
                );

            openCamera();

        })

        .catch(() => {

            setStatus(
                "AUTORISATION CAMÉRA REFUSÉE"
            );

        });

}


/* =========================
   ARRÊTER CAMERA
========================= */

function stopCamera() {

    if (stream) {

        stream
            .getTracks()
            .forEach(
                track =>
                    track.stop()
            );

        stream = null;

    }


    $("camera").srcObject =
        null;


    if (trackingTimer) {

        cancelAnimationFrame(
            trackingTimer
        );

        trackingTimer = null;

    }

}


/* =========================
   TRACKING
========================= */

function startTracking() {

    if (trackingTimer) {

        cancelAnimationFrame(
            trackingTimer
        );

    }


    const canvas =
        $("trackCanvas");

    const ctx =
        canvas.getContext(
            "2d",
            {
                willReadFrequently: true
            }
        );


    function loop() {

        if (
            !playing ||
            !stream
        ) {

            return;

        }


        if (
            $("camera").readyState >= 2
        ) {

            canvas.width =
                cfg.width;

            canvas.height =
                cfg.height;


            ctx.drawImage(

                $("camera"),

                0,
                0,

                cfg.width,
                cfg.height

            );


            const image =
                ctx.getImageData(
                    0,
                    0,
                    cfg.width,
                    cfg.height
                );


            const data =
                image.data;


            let sx = 0;
            let sy = 0;
            let count = 0;


            const [
                targetH,
                targetS,
                targetV
            ] = targetHsv();


            const step = 4;


            for (
                let y = 0;
                y < cfg.height;
                y += step
            ) {

                for (
                    let x = 0;
                    x < cfg.width;
                    x += step
                ) {

                    const i =
                        (
                            y *
                            cfg.width +
                            x
                        ) * 4;


                    const r =
                        data[i];

                    const g =
                        data[i + 1];

                    const b =
                        data[i + 2];


                    if (
                        cfg.tracking ===
                        "bright"
                    ) {

                        if (
                            r + g + b >
                            690
                        ) {

                            sx += x;
                            sy += y;
                            count++;

                        }

                    } else {

                        const [
                            h,
                            s,
                            v
                        ] =
                            rgbToHsv(
                                r,
                                g,
                                b
                            );


                        let dh =
                            Math.abs(
                                h - targetH
                            );


                        dh =
                            Math.min(
                                dh,
                                360 - dh
                            );


                        if (

                            dh <
                            cfg.tolerance &&

                            Math.abs(
                                s -
                                targetS
                            ) < .55 &&

                            v > .18

                        ) {

                            sx += x;
                            sy += y;

                            count++;

                        }

                    }

                }

            }


            if (count > 8) {

                const x =
                    sx / count;

                const y =
                    sy / count;


                /*
                 * Position du gardien.
                 */

                const percentX =
                    (
                        1 -
                        x / cfg.width
                    ) * 100;


                const keeperPosition =
                    Math.max(
                        8,
                        Math.min(
                            92,
                            percentX
                        )
                    );


                $("keeper")
                    .style.left =
                        keeperPosition +
                        "%";


                /*
                 * Carré de tracking.
                 */

                $("trackBox")
                    .style.display =
                        "block";


                $("trackBox")
                    .style.left =
                        (
                            x /
                            cfg.width *
                            100
                        ) + "%";


                $("trackBox")
                    .style.top =
                        (
                            y /
                            cfg.height *
                            100
                        ) + "%";

            } else {

                $("trackBox")
                    .style.display =
                        "none";

            }

        }


        trackingTimer =
            requestAnimationFrame(
                loop
            );

    }


    loop();

}


/* =========================
   START GAME
========================= */

$("startBtn")
    .addEventListener(
        "click",
        () => {

            $("menu")
                .classList
                .add("hidden");

            requestCameraPermission();

        }
    );


/* =========================
   CONNECT CAMERA
========================= */

$("cameraBtn")
    .addEventListener(
        "click",
        () => {

            requestCameraPermission();

        }
    );


/* =========================
   SETTINGS
========================= */

$("settingsBtn")
    .addEventListener(
        "click",
        () => {

            $("menu")
                .classList
                .add("hidden");

            $("settings")
                .classList
                .remove("hidden");

        }
    );


/* =========================
   TOLERANCE
========================= */

$("tolerance")
    .addEventListener(
        "input",
        event => {

            $("tolVal")
                .textContent =
                event.target.value;

        }
    );


/* =========================
   APPLY SETTINGS
========================= */

$("applyBtn")
    .addEventListener(
        "click",
        () => {

            const [
                width,
                height
            ] =
                $("resolution")
                    .value
                    .split("x")
                    .map(Number);


            cfg.width =
                width;

            cfg.height =
                height;

            cfg.color =
                $("color").value;

            cfg.tolerance =
                Number(
                    $("tolerance").value
                );

            cfg.tracking =
                $("tracking").value;

            cfg.preview =
                $("preview").value;


            $("settings")
                .classList
                .add("hidden");


            $("menu")
                .classList
                .remove("hidden");


            if (stream) {

                openCamera();

            }

        }
    );


/* =========================
   BACK
========================= */

$("backBtn")
    .addEventListener(
        "click",
        () => {

            $("settings")
                .classList
                .add("hidden");

            $("menu")
                .classList
                .remove("hidden");

        }
    );

</script>

</body>
</html>
